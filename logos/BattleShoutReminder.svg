<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#0f2f45"/>
      <stop offset="1" stop-color="#050d16"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#33ccff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#33ccff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="1" stop-color="#5fc8ef"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e09a1a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="384" height="384" rx="76" fill="url(#bg)"/>
  <circle cx="200" cy="205" r="170" fill="url(#glow)"/>
  <!-- the buff's timer ring, mostly run out -->
  <circle cx="200" cy="205" r="132" fill="none" stroke="#33ccff" stroke-opacity="0.22" stroke-width="16"/>
  <path d="M 200 73 A 132 132 0 0 1 314 271" fill="none" stroke="#33ccff" stroke-width="16" stroke-linecap="round"/>
  <!-- two stacked up-chevrons: a buff -->
  <path d="M 200 104 L 284 188 L 250 222 L 200 172 L 150 222 L 116 188 Z" fill="url(#arrow)" stroke="#06253a" stroke-width="8" stroke-linejoin="round"/>
  <path d="M 200 192 L 284 276 L 250 310 L 200 260 L 150 310 L 116 276 Z" fill="url(#arrow)" stroke="#06253a" stroke-width="8" stroke-linejoin="round" opacity="0.85"/>
  <!-- the notice: a gold badge with ! -->
  <circle cx="306" cy="98" r="50" fill="url(#gold)" stroke="#3a2306" stroke-width="8"/>
  <rect x="297" y="66" width="18" height="40" rx="8" fill="#3a2306"/>
  <circle cx="306" cy="124" r="10" fill="#3a2306"/>
</svg>
