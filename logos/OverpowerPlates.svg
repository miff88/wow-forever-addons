<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#3a1d08"/>
      <stop offset="1" stop-color="#120803"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd100" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffd100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a97a3"/>
      <stop offset="1" stop-color="#2f3740"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d98a12"/>
      <stop offset="1" stop-color="#ffe27a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="384" height="384" rx="76" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="170" fill="url(#glow)"/>
  <!-- the shield that took the hit -->
  <path d="M 70 88 L 220 88 Q 228 236 145 320 Q 62 236 70 88 Z" fill="url(#shield)" stroke="#120803" stroke-width="10" stroke-linejoin="round"/>
  <path d="M 92 108 L 198 108 Q 202 222 145 288 Q 88 222 92 108 Z" fill="none" stroke="#d4dde5" stroke-opacity="0.45" stroke-width="6"/>
  <path d="M 145 120 L 145 270 M 104 168 L 186 168" stroke="#d4dde5" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(-14 0)">
  <!-- the blow coming in -->
  <path d="M 356 300 Q 280 262 236 218" fill="none" stroke="#f3e6c8" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 22"/>
  <!-- and going straight back: payback -->
  <path d="M 230 214 Q 246 140 326 116" fill="none" stroke="#120803" stroke-width="34" stroke-linecap="round"/>
  <path d="M 230 214 Q 246 140 326 116" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  <path d="M 362 104 L 318 88 L 330 140 Z" fill="#ffd100" stroke="#120803" stroke-width="8" stroke-linejoin="round"/>
  <!-- the spark where it landed -->
  <path d="M 232 214 l 10 -30 l 8 26 l 28 -12 l -18 24 l 28 12 l -30 4 l 6 28 l -20 -20 l -16 24 l 0 -30 l -28 2 l 22 -18 z" fill="#fff3b0" stroke="#120803" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
