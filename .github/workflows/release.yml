# Publishes new addon versions automatically.
#
# Runs when a version change reaches main (any .toc file, curseforge.json or this workflow),
# or by hand from the Actions tab. For every addon in curseforge.json whose current .toc
# version hasn't been released yet, it uploads the zip to CurseForge as a WoW Forever
# (1.60.1) file, then creates a GitHub release and tag "<Addon>-v<version>" with the same zip.
#
# Needs the repository secret CF_API_TOKEN (a CurseForge API token).
# If a CurseForge upload fails, nothing is marked released, so "Re-run jobs" retries it.

name: Release addons

on:
  push:
    branches: [main]
    paths:
      - "**/*.toc"
      - "curseforge.json"
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-addons
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release any new versions
        env:
          GH_TOKEN: ${{ github.token }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          status=0
          for addon in $(jq -r 'keys[]' curseforge.json); do
            echo "::group::$addon"
            .github/scripts/release.sh "$addon" || status=1
            echo "::endgroup::"
          done
          exit $status
